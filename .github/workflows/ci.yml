name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '7.4', '8.3' ]
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      # The theme declares PHP 7.4, so the oldest version must parse every file.
      - name: PHP syntax
        run: |
          set -e
          find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Landing page copy is complete in four languages
        run: php tests/check-landing-copy.php

      - name: Version numbers agree
        run: php tests/check-versions.php

  front-end:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: JavaScript syntax
        run: |
          set -e
          for f in assets/js/*.js; do node --check "$f"; done

      - name: JSON is valid
        run: |
          set -e
          python3 -m json.tool theme.json > /dev/null
